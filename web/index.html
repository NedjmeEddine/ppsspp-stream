<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPSSPP-Stream — Out-of-Core PSP Web Player</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 20% 20%, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            overflow: hidden;
        }
        #home {
            display: flex; flex-direction: column; height: 100%; padding: 2rem;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.02em; color: #38bdf8; }
        .badges { display: flex; gap: 8px; }
        .badge {
            font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 9999px;
            background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #cbd5e1;
        }
        .badge.ok { background: rgba(6, 78, 59, 0.8); border-color: #10b981; color: #6ee7b7; }
        .badge.warn { background: rgba(113, 63, 18, 0.8); border-color: #f59e0b; color: #fde047; }
        #game-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem; overflow-y: auto; padding: 4px;
        }
        .game-card {
            background: rgba(30, 41, 59, 0.7); border: 1.5px solid #334155;
            border-radius: 12px; padding: 1.1rem; cursor: pointer; text-align: left;
            color: inherit; transition: border-color 0.15s, transform 0.15s;
        }
        .game-card:hover, .game-card:focus-visible {
            border-color: #38bdf8; transform: translateY(-2px); outline: none;
        }
        .game-title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
        .game-meta { font-size: 0.78rem; color: #94a3b8; }
        #viewport-wrapper {
            display: none; position: fixed; inset: 0; background: #020617;
            flex-direction: column; align-items: center; justify-content: center; z-index: 50;
        }
        #stage { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
        canvas#emulator-canvas {
            aspect-ratio: 16 / 9; max-width: 100%; max-height: 100%;
            background: #000; border: 1px solid #1e293b;
        }
        #emu-banner {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
            pointer-events: none; text-align: center; padding: 1rem;
        }
        #emu-banner-title { font-weight: 700; font-size: 1.125rem; color: #38bdf8; }
        #emu-banner-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8125rem; color: #94a3b8; }
        canvas#hud-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        #controls-bar {
            width: 100%; height: 48px; background: #0f172a; border-top: 1px solid #1e293b;
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
        }
        .ui-btn {
            background: #0284c7; color: #fff; border: none; border-radius: 6px;
            padding: 6px 12px; font-weight: 600; cursor: pointer;
        }
        .ui-btn-secondary { background: #334155; }
    </style>
</head>
<body>
    <main id="home">
        <header>
            <h1>PPSSPP-Stream <span style="color:#94a3b8;font-weight:400;font-size:0.95rem;">Out-of-Core UMD Launcher</span></h1>
            <div class="badges">
                <span id="badge-iso" class="badge">Checking...</span>
                <span id="badge-stream" class="badge ok">64 MB RAM Pool</span>
            </div>
        </header>
        <div id="game-grid" role="grid" aria-label="PSP Games"></div>
    </main>

    <div id="viewport-wrapper">
        <div id="stage">
            <canvas id="emulator-canvas" width="480" height="272"></canvas>
            <div id="emu-banner" aria-live="polite">
                <div id="emu-banner-title"></div>
                <div id="emu-banner-sub"></div>
            </div>
            <canvas id="hud-canvas"></canvas>
        </div>
        <div id="controls-bar">
            <span id="emu-game-label" style="font-weight:600;color:#cbd5e1;">PSP</span>
            <div style="display:flex;gap:8px;">
                <button id="btn-toggle-hud" class="ui-btn ui-btn-secondary">Toggle Memory HUD</button>
                <button id="btn-return-menu" class="ui-btn ui-btn-secondary">XMB Menu</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createHudOverlay } from './hud_overlay.mjs';
        import { createCoreHost } from './core_host.mjs';
        import { createInputBridge } from './input_bridge.mjs';

        const grid = document.getElementById('game-grid');
        const badgeIso = document.getElementById('badge-iso');
        const badgeStream = document.getElementById('badge-stream');
        const viewport = document.getElementById('viewport-wrapper');
        const stage = document.getElementById('stage');
        const bannerEl = document.getElementById('emu-banner');
        const bannerTitleEl = document.getElementById('emu-banner-title');
        const bannerSubEl = document.getElementById('emu-banner-sub');
        const hudCanvas = document.getElementById('hud-canvas');
        const gameLabel = document.getElementById('emu-game-label');
        let emuCanvas = document.getElementById('emulator-canvas');

        let workerA = null;
        let workerB = null;
        let coreHost = null;
        let inputBridge = null;
        let exitPromise = null;
        let launchGen = 0;
        let hud = null;
        let showHud = true;
        let latestSnapshot = null;
        let opfsMode = 'stream-only';
        let activePoolMb = 64;

        function resizeHud() {
            const rect = stage.getBoundingClientRect();
            hudCanvas.width = Math.max(1, Math.round(rect.width || viewport.clientWidth || 960));
            hudCanvas.height = Math.max(1, Math.round(rect.height || (viewport.clientHeight - 48) || 540));
            if (!hud) hud = createHudOverlay(hudCanvas);
            if (hud && showHud && latestSnapshot) {
                hud.render(latestSnapshot, {
                    storageMode: opfsMode,
                    gpuStatus: coreHost ? `WebGL2 (${coreHost.getFrameCount()}f)` : 'WebGL2 Target',
                    vramLabel: `Unified Slab (${activePoolMb} MB)`
                });
            }
        }
        window.addEventListener('resize', resizeHud);
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(resizeHud).observe(stage);
        }

        function resetEmulatorCanvas() {
            const fresh = document.createElement('canvas');
            fresh.id = 'emulator-canvas';
            fresh.width = 480;
            fresh.height = 272;
            if (emuCanvas && emuCanvas.parentNode) {
                emuCanvas.parentNode.replaceChild(fresh, emuCanvas);
            } else {
                stage.prepend(fresh);
            }
            emuCanvas = fresh;
            return fresh;
        }

        function drawBanner(title, discId) {
            bannerTitleEl.textContent = title || '';
            bannerSubEl.textContent = discId ? `UMD ${discId} — Streaming 256 KB blocks` : 'Mounting UMD...';
            bannerEl.style.display = 'flex';
        }

        async function launchGame(game) {
            const myGen = ++launchGen;
            if (exitPromise) {
                await exitPromise;
                if (myGen !== launchGen) return;
            }
            if (inputBridge) {
                inputBridge.destroy();
                inputBridge = null;
                window.__ppssppInputBridge = null;
            }
            if (coreHost) {
                await coreHost.shutdown();
                coreHost = null;
                window.__ppssppCoreHost = null;
                if (myGen !== launchGen) return;
            }

            viewport.style.display = 'flex';
            gameLabel.textContent = `${game.title} (PSP)`;
            resizeHud();
            const targetCanvas = resetEmulatorCanvas();
            drawBanner(game.title, '');

            if (workerA) { workerA.terminate(); workerA = null; }
            if (workerB) { workerB.terminate(); workerB = null; }

            const ch = new MessageChannel();
            workerA = new Worker('worker_a.js', { type: 'module' });
            workerB = new Worker('worker_b.js', { type: 'module' });

            let nextId = 1;
            const pending = new Map();
            let coreBootStarted = false;
            function callA(msg) {
                return new Promise((resolve) => {
                    const id = nextId++;
                    pending.set(id, resolve);
                    workerA.postMessage({ ...msg, id });
                });
            }

            workerA.onmessage = (e) => {
                const d = e.data || {};
                if (d.type === 'BUILD_ROTATED') {
                    badgeIso.textContent = 'Build Updated — Reload';
                    badgeIso.className = 'badge warn';
                    return;
                }
                if (d.id && pending.has(d.id)) {
                    const res = pending.get(d.id);
                    pending.delete(d.id);
                    res(d);
                }
            };

            workerB.onmessage = async (e) => {
                if (myGen !== launchGen) return;
                const { type, snapshot, opfsMode: mode, effectivePoolMB, reason } = e.data || {};
                if (type === 'STATUS') {
                    if (mode) opfsMode = mode;
                    if (effectivePoolMB) activePoolMb = effectivePoolMB;
                    badgeStream.textContent = `${activePoolMb} MB RAM Pool (${opfsMode})`;
                    workerB.postMessage({ type: 'ENABLE_HUD', enabled: true });

                    if (coreBootStarted) return;
                    coreBootStarted = true;

                    const openRes = await callA({ type: 'DISC_OPEN', path: 'game.iso' });
                    if (myGen !== launchGen) return;
                    if (!openRes.ok) {
                        badgeIso.textContent = 'Disc Open Failed';
                        badgeIso.className = 'badge warn';
                        return;
                    }

                    const idRes = await callA({ type: 'DISC_IDENTIFY' });
                    if (myGen !== launchGen) return;
                    badgeIso.textContent = idRes.ok ? `UMD Ready (${idRes.discId})` : 'Raw Stream Ready';
                    badgeIso.className = 'badge ok';
                    drawBanner(idRes.title || game.title, idRes.discId || '');

                    try {
                        const host = await createCoreHost({
                            canvas: targetCanvas,
                            workerA,
                            discSize: openRes.size || game.discSize,
                            getLatestSnapshot: () => latestSnapshot,
                            onFrame: () => {
                                inputBridge?.poll();
                            },
                            onFirstFrame: () => {
                                if (myGen !== launchGen) return;
                                bannerEl.style.display = 'none';
                            },
                            onFatal: (msg) => {
                                if (myGen !== launchGen) return;
                                badgeIso.textContent = msg || 'WebGL2 Error';
                                badgeIso.className = 'badge warn';
                            },
                        });
                        if (myGen !== launchGen) {
                            await host.shutdown();
                            return;
                        }
                        coreHost = host;
                        if (inputBridge) inputBridge.destroy();
                        inputBridge = createInputBridge({
                            target: window,
                            getModule: () => coreHost?.getModule(),
                        });
                        window.__ppssppInputBridge = inputBridge;
                        window.__ppssppCoreHost = host;
                    } catch (err) {
                        if (myGen === launchGen) {
                            badgeIso.textContent = err?.message || 'WebGL2 Boot Error';
                            badgeIso.className = 'badge warn';
                        }
                    }
                } else if (type === 'HUD_SNAPSHOT') {
                    latestSnapshot = snapshot || e.data;
                    if (hud && showHud) {
                        hud.render(latestSnapshot, {
                            storageMode: opfsMode,
                            gpuStatus: coreHost ? `WebGL2 (${coreHost.getFrameCount()}f)` : 'WebGL2 Target',
                            vramLabel: `Unified Slab (${activePoolMb} MB)`
                        });
                    }
                } else if (type === 'BUILD_ROTATED') {
                    badgeIso.textContent = 'Build Updated — Reload';
                    badgeIso.className = 'badge warn';
                } else if (type === 'FATAL') {
                    badgeIso.textContent = `Worker Err: ${reason}`;
                    badgeIso.className = 'badge warn';
                }
            };

            workerA.postMessage({ type: 'PORT', port: ch.port1 }, [ch.port1]);
            workerB.postMessage({ type: 'PORT', port: ch.port2, gameId: game.id }, [ch.port2]);
        }

        function exitToMenu() {
            ++launchGen;
            if (exitPromise) return exitPromise;

            exitPromise = (async () => {
                const oldInput = inputBridge;
                inputBridge = null;
                window.__ppssppInputBridge = null;
                if (oldInput) {
                    oldInput.destroy();
                }

                const oldHost = coreHost;
                coreHost = null;
                window.__ppssppCoreHost = null;
                if (oldHost) {
                    await oldHost.shutdown();
                }

                if (workerA) { workerA.terminate(); workerA = null; }
                const oldB = workerB;
                workerB = null;
                if (oldB) {
                    await new Promise((resolve) => {
                        let done = false;
                        const stop = () => {
                            if (!done) {
                                done = true;
                                oldB.terminate();
                                resolve();
                            }
                        };
                        oldB.onmessage = (ev) => { if (ev.data?.type === 'TELEM_FLUSHED') stop(); };
                        oldB.postMessage({ type: 'FLUSH_TELEMETRY', reason: 'menu' });
                        setTimeout(stop, 150);
                    });
                }
                viewport.style.display = 'none';
            })().finally(() => {
                exitPromise = null;
            });

            return exitPromise;
        }

        document.getElementById('btn-toggle-hud').addEventListener('click', () => {
            showHud = !showHud;
            if (!showHud) {
                const ctx = hudCanvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
            } else if (latestSnapshot && hud) {
                hud.render(latestSnapshot, {
                    storageMode: opfsMode,
                    gpuStatus: coreHost ? `WebGL2 (${coreHost.getFrameCount()}f)` : 'WebGL2 Target',
                    vramLabel: `Unified Slab (${activePoolMb} MB)`
                });
            }
        });
        document.getElementById('btn-return-menu').addEventListener('click', exitToMenu);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && workerB) {
                workerB.postMessage({ type: 'FLUSH_TELEMETRY', reason: 'pagehide' });
            }
        });

        fetch('/games.json')
            .then(r => r.ok ? r.json() : null)
            .then(cat => {
                if (!cat || !cat.games || cat.games.length === 0) {
                    badgeIso.textContent = 'No Catalog';
                    badgeIso.className = 'badge warn';
                    return;
                }
                badgeIso.textContent = 'Streaming Ready';
                badgeIso.className = 'badge ok';
                for (const g of cat.games) {
                    const btn = document.createElement('button');
                    btn.className = 'game-card';
                    btn.dataset.gameId = g.id;
                    btn.innerHTML = `<div class="game-title"></div><div class="game-meta"></div>`;
                    btn.querySelector('.game-title').textContent = g.title;
                    btn.querySelector('.game-meta').textContent = `PSP UMD • ${(g.discSize / (1024 * 1024)).toFixed(1)} MB`;
                    btn.addEventListener('click', () => launchGame(g));
                    grid.appendChild(btn);
                }
            })
            .catch(() => {
                badgeIso.textContent = 'Standalone Mode';
                badgeIso.className = 'badge warn';
            });
    </script>
</body>
</html>
